[package]
name = "netraze-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
netraze-core = { path = "../netraze-core" }
# Pure-Rust DCE/RPC v5 stack — required by `smb::rpc::SmbPipeTransport`,
# the Phase 3 carrier that lets DCE/RPC PDUs ride over SMB2 named pipes.
netraze-dcerpc = { path = "../netraze-dcerpc" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
rasn = { workspace = true }
rasn-ldap = { workspace = true }
rusthound-ce = { workspace = true }

# Pure-Rust crypto stack — replaces `windows::Win32::Security::Cryptography::BCrypt*`.
# See crates/netraze-protocols/src/smb/crypto.rs for the consumers.
aes = { workspace = true }
cbc = { workspace = true }
cipher = { workspace = true }
des = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
md-5 = { workspace = true }
md4 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
